[project]
name = "dryas"
version = "0.1.0"
description = "DRYAS — multi-century earthquake-cascade reconstruction from a tree-ring sensor array (dendroseismology x ML source separation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.8",
    "requests>=2.32",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "python-docx>=1.2.0",
]

# Heavy ML deps (separation GNN, script 005+) live in an optional group so the
# base environment stays light. Install with:  uv sync --extra ml
[project.optional-dependencies]
ml = [
    "torch>=2.3",
]
gmt = [
    "pygmt>=0.19.0",
]

[tool.uv]
# keep resolution reproducible
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
